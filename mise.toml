[tools]
node = "22.23.2"
bun = "1.3.14"

[tasks."ci:app"]
description = "Run the app CI checks"
run = [
  "npm ci",
  "npm run catalog:check",
  "npm run typecheck",
  "npm run lint",
  "npm test",
  "npm run build",
]

[tasks."ci:cli"]
description = "Run the CLI CI checks"
dir = "cli"
env = { HOIST_CLI_OUTFILE = "/tmp/hoist-test", HOIST_CLI_TARGET = "bun-linux-x64" }
run = [
  "bun install --frozen-lockfile",
  "bun run typecheck",
  "bun build src/index.ts --compile --outfile=$HOIST_CLI_OUTFILE --target=$HOIST_CLI_TARGET",
]

[tasks."release:cli"]
description = "Validate and build all CLI release binaries"
dir = "cli"
run = [
  "bun install --frozen-lockfile",
  "bun run typecheck",
  "bun run scripts/build-all.ts",
]

[tasks."release:app"]
description = "Build an app release for the requested electron-builder target"
run = [
  "npm ci",
  '''node -e "const fs=require('node:fs');const p=require('./package.json');p.version=process.env.VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"''',
  "npm run package --",
]
