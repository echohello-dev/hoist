[tools]
node = "26.7.0"
bun = "1.3.14"

[tasks."ci:app"]
description = "Run the app CI checks"
file = "scripts/ci/app.sh"

[tasks."ci:cli"]
description = "Run the CLI CI checks"
env = { HOIST_CLI_OUTFILE = "/tmp/hoist-test", HOIST_CLI_TARGET = "bun-linux-x64" }
file = "scripts/ci/cli.sh"

[tasks."release:cli"]
description = "Validate and build all CLI release binaries"
file = "scripts/ci/release-cli.sh"

[tasks."release:app"]
description = "Build an app release for the requested electron-builder target"
file = "scripts/ci/release-app.sh"

[tasks."release:detect"]
description = "Detect the release component from the Git tag"
file = "scripts/ci/detect-release.sh"

[tasks."release:calver"]
description = "Calculate the next SemVer-compatible CalVer release"
file = "scripts/ci/calver.sh"

[tasks."release:approve-ci"]
description = "Approve CI for the trusted Release Please PR"
file = "scripts/ci/approve-release-ci.sh"
