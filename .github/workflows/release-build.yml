name: Release Build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.detect.outputs.component }}
    steps:
      - id: detect
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == cli-* ]]; then
            echo "component=cli" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == v* ]]; then
            echo "component=app" >> "$GITHUB_OUTPUT"
          else
            echo "Unknown tag shape: $TAG" >&2
            exit 1
          fi

  build-cli:
    needs: detect
    if: needs.detect.outputs.component == 'cli'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.6
          install_args: bun
      - name: Build CLI release
        run: mise run release:cli
      - name: Upload binaries to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: cli/dist/hoist-*
          tag_name: ${{ github.ref_name }}

  build-app:
    needs: detect
    if: needs.detect.outputs.component == 'app'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac-arm64
            args: --mac dmg:arm64
          - os: macos-15-intel
            target: mac-x64
            args: --mac dmg:x64
          - os: windows-latest
            target: win-x64
            args: --win nsis:x64
          - os: windows-11-arm
            target: win-arm64
            args: --win nsis:arm64
          - os: ubuntu-latest
            target: linux-x64
            args: --linux AppImage:x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            args: --linux AppImage:arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.6
          install_args: node
      - name: Build and package app
        run: mise run release:app ${{ matrix.args }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing/notarization: opt-in via repo secrets.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Upload artifacts to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.yml
            release/*.blockmap
          tag_name: ${{ github.ref_name }}
