name: Approve Release CI

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Approve Release Please CI
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          RUN=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
            --jq '[.conclusion, .actor.login, .head_branch] | join("|")')

          if [[ "$RUN" == "action_required|github-actions[bot]|release-please--branches--main" ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/approve"
          else
            echo "No trusted Release Please run to approve"
          fi
